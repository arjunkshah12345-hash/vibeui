    <style>

      .card { background: var(--surface); border: 1px solid var(--line); border-radius: calc(var(--r) * 1.33); padding: 30px; box-shadow: 0 1px 1px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.05); }

      .tabs span { font: 500 19px "Geist", sans-serif; padding: 9px 20px; border-radius: calc(var(--r) * .7); color: var(--muted); }

      .prog .row b { font: 400 17px "Geist Mono", monospace; }
      .bar { height: 10px; border-radius: 6px; background: var(--sunken); overflow: hidden; }

      .sw2 { display: flex; align-items: center; gap: 18px; font: 22px "Geist", sans-serif; color: var(--muted); }
      .sw2 .tr { width: 64px; height: 36px; border-radius: 18px; background: var(--accent); position: relative; }
      .sw2 .tr::after { content: ""; position: absolute; right: 4px; top: 4px; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-ink); }
    </style>
    <script>
      const OFF = 20;
      const base = gsap.timeline({ paused: true });
      // Scene-local clock: positions authored in film time are rebased to this scene's start.
      const tl = new Proxy(base, { get(t, p) {
        if (p === "to" || p === "fromTo" || p === "set") return (...a) => { a[a.length - 1] -= OFF; return t[p](...a); };
        const v = t[p]; return typeof v === "function" ? v.bind(t) : v;
      } });
      const $ = (s) => document.querySelector(s);
      const $$ = (s) => Array.from(document.querySelectorAll(s));
      const hide = (sel) => gsap.set(sel, { opacity: 0 });
      

      gsap.set("#s4h", { opacity: 0, y: 30 }); gsap.set("#panel", { opacity: 0, x: -50 }); gsap.set("#board", { opacity: 0, y: 50, scale: 0.97 });
      gsap.set("#a0", { opacity: 1 });
      tl.to("#s4h", { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 20.1);
      tl.to("#panel", { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, 20.3);
      tl.to("#board", { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "power3.out" }, 20.45);
      const swX = [0, 70, 140, 210];
      const setAcc = (t, i, col, ink) => {
        tl.to("#ring", { x: swX[i], duration: 0.45, ease: "back.out(1.6)" }, t);
        tl.to("#s4", { "--accent": col, "--accent-ink": ink, duration: 0.6, ease: "power2.out" }, t);
        [0, 1, 2, 3, 4].forEach((k) => tl.set("#a" + k, { opacity: k === i ? 1 : 0 }, t + 0.1));
      };
      setAcc(21.3, 1, "#4f46e5", "#ffffff");
      setAcc(22.7, 2, "#0f8a5f", "#ffffff");
      setAcc(24.1, 3, "#c42f63", "#ffffff");
      // radius slider: 12 → 28 → 2
      const rd = { r: 12 };
      const applyR = () => {
        $("#s4").style.setProperty("--r", rd.r.toFixed(1) + "px");
        const pct = (rd.r / 28) * 100; $("#rfill").style.width = pct + "%"; $("#rthumb").style.left = pct + "%";
        $("#rval").textContent = Math.round(rd.r); $("#rcode").textContent = Math.round(rd.r) + "px;";
      };
      tl.to(rd, { r: 28, duration: 1.2, ease: "power2.inOut", onUpdate: applyR }, 25.0);
      tl.to(rd, { r: 2, duration: 0.9, ease: "power2.inOut", onUpdate: applyR }, 26.4);
      // theme flip → dark (accent becomes the ink)
      tl.to("#segpill", { x: 186, duration: 0.4, ease: "power3.out" }, 27.65);
      tl.to("#s4", { "--bg": "#0f0e0d", "--fg": "#f4f2ee", "--muted": "#9a968d", "--surface": "#181715", "--sunken": "#121110", "--line": "rgba(244,242,238,0.09)", "--linestrong": "rgba(244,242,238,0.18)", "--accent": "#f4f2ee", "--accent-ink": "#14130f", duration: 0.6, ease: "power2.inOut" }, 27.7);
      [0, 1, 2, 3, 4].forEach((k) => tl.set("#a" + k, { opacity: k === 4 ? 1 : 0 }, 27.9));
      tl.to("#s4h,#panel,#board", { opacity: 0, duration: 0.4, ease: "power2.in" }, 29.55);
      window.__timelines["s4"] = base;
    </script>
