      .dlg .bt { margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px; }
      .dlg .bt span { height: 46px; padding: 0 20px; border-radius: 12px; display: inline-flex; align-items: center; font: 500 19px "Geist", sans-serif; }
      .dlg .x { position: absolute; right: 18px; top: 18px; width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #9a968d; font: 400 26px "Geist", sans-serif; }
    </style>
    <script>
      const OFF = 30;
      const base = gsap.timeline({ paused: true });
      // Scene-local clock: positions authored in film time are rebased to this scene's start.
      const tl = new Proxy(base, { get(t, p) {
        if (p === "to" || p === "fromTo" || p === "set") return (...a) => { a[a.length - 1] -= OFF; return t[p](...a); };
        const v = t[p]; return typeof v === "function" ? v.bind(t) : v;
      } });
      const $ = (s) => document.querySelector(s);
      const $$ = (s) => Array.from(document.querySelectorAll(s));
      const hide = (sel) => gsap.set(sel, { opacity: 0 });
      

      const ICONS = [
        ["Home", '<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/>'],
        ["Components", '<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>'],
        ["Search", '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>'],
        ["Messages", '<path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H10l-5 4v-4a2 2 0 0 1-1-2z"/>'],
        ["Explore", '<circle cx="12" cy="12" r="8.5"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>'],
        ["Settings", '<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>'],
      ];
      const row = $("#dockrow"); const dks = [];
      ICONS.forEach(([n, svg]) => { const d = document.createElement("div"); d.className = "dk"; d.innerHTML = '<svg viewBox="0 0 24 24">' + svg + "</svg>"; row.appendChild(d); dks.push(d); });
      ["#tA", "#tB", "#tC", "#tD"].forEach((s) => gsap.set(s, { opacity: 0, y: 40, scale: 0.96 }));
      gsap.set("#stkt", { x: 90 }); gsap.set("#s5h", { opacity: 0, y: 24 }); gsap.set("#toast1", { opacity: 0, y: 40 }); gsap.set("#dlg", { opacity: 0, scale: 0.94, y: 8 });
      tl.to("#s5h", { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 30.1);
      ["#tA", "#tB", "#tC", "#tD"].forEach((s, i) => tl.to(s, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.3)" }, 30.25 + i * 0.2));
      // dock magnify driven by a sweeping pointer
      const dp = { x: -200 };
      // Geometry is fixed by the layout (6 × 76px icons, 14px gap, centred in a 820px tile): no measuring inside callbacks.
      const DK_C = (i) => 185 + 90 * i;
      const dockApply = () => {
        let hov = -1, best = 1e9;
        dks.forEach((d, i) => {
          const dist = Math.abs(dp.x - DK_C(i)); const sc = 1 + 0.7 * Math.exp(-Math.pow(dist / 95, 2));
          d.style.scale = sc.toFixed(3); d.style.translate = "0 " + ((sc - 1) * -22).toFixed(1) + "px";
          if (dist < best) { best = dist; hov = i; }
        });
        const tip = $("#dktip");
        if (best < 60) { const w = ICONS[hov][0].length * 10.4 + 30; tip.textContent = ICONS[hov][0]; tip.style.opacity = "1"; tip.style.left = (DK_C(hov) - w / 2) + "px"; tip.style.top = "132px"; } else tip.style.opacity = "0";
      };
      tl.to(dp, { x: 780, duration: 1.8, ease: "sine.inOut", onUpdate: dockApply }, 30.9);
      tl.to(dp, { x: 60, duration: 1.8, ease: "sine.inOut", onUpdate: dockApply }, 32.8);
      tl.to(dp, { x: 900, duration: 1.2, ease: "sine.inOut", onUpdate: dockApply }, 34.7);
      // controls
      const flip = (sel, t) => { tl.to(sel + " .th", { x: 28, backgroundColor: "#14130f", duration: 0.35, ease: "back.out(1.7)" }, t); tl.to(sel, { backgroundColor: "#f4f2ee", borderColor: "#f4f2ee", duration: 0.3 }, t); };
      flip("#tg1", 31.4); flip("#tg2", 32.6);
      tl.fromTo("#cb1 i", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 33.4);
      tl.to("#stkf", { width: "78%", duration: 1.1, ease: "power2.inOut" }, 34.0); tl.to("#stkt", { x: 234, duration: 1.1, ease: "power2.inOut" }, 34.0);
      // toast with countdown
      tl.to("#toast1", { opacity: 1, y: 0, duration: 0.55, ease: "back.out(1.6)" }, 31.95);
      tl.fromTo("#cd1", { scaleX: 1 }, { scaleX: 0, duration: 3.0, ease: "none" }, 31.95);
      tl.to("#toast2", { opacity: 1, duration: 0.01 }, 33.2); tl.fromTo("#toast2", { y: 40, scale: 0.96 }, { y: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 33.2);
      tl.to("#toast1", { opacity: 0, x: 60, duration: 0.35, ease: "power2.in" }, 35.05);
      tl.to("#toast2", { opacity: 0, x: 60, duration: 0.35, ease: "power2.in" }, 35.3);
      // dialog opens, then animates out
      tl.to("#scrim", { opacity: 1, duration: 0.3 }, 32.2);
      tl.to("#dlg", { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(1.5)" }, 32.2);
      tl.to("#dlgx", { rotation: 90, backgroundColor: "rgba(244,242,238,.12)", color: "#f4f2ee", duration: 0.4 }, 34.5);
      tl.to("#dlg", { opacity: 0, scale: 0.96, y: 6, duration: 0.25, ease: "power2.in" }, 34.95);
      tl.to("#scrim", { opacity: 0, duration: 0.3 }, 34.95);
      // exit
      ["#tA", "#tB", "#tC", "#tD"].forEach((s, i) => tl.to(s, { opacity: 0, y: -24, scale: 0.97, duration: 0.35, ease: "power2.in" }, 37.0 + i * 0.05));
      tl.to("#s5h", { opacity: 0, duration: 0.3 }, 37.05);
      window.__timelines["s5"] = base;
    </script>
