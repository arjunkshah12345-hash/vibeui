name: Bug report
description: Something looks or behaves wrong
labels: [bug]
body:
  - type: input
    id: component
    attributes:
      label: Component
      description: The file name, e.g. dialog or rotating-carousel
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: A minimal snippet or a link to a repo / sandbox.
      render: tsx
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: VibeUI version, React, Tailwind, framework, browser.
      placeholder: "vibeui 0.5.0, React 19, Tailwind 4.3, Next 16, Safari 26"
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options: [Light, Dark, Both]
    validations:
      required: false
